<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TurboCore(Beginner)</title>
    <style>

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
        }
        .wrapper {
            width: 1280px;
            margin: 0 auto;
        }
        .top-bar {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #E2E3EF;
            height: 100px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            width: 300px;
        }
        .logo-text {
            margin-left: 10px;
        }
        .logo-title {
            font-weight: bold;
            font-size: 24px;
            color: #F35A05;
        }
        .logo-subtitle {
            font-size: 13px;
        }
        .menu {
            margin-left: 150px; /* Магический отступ, чтобы подвинуть центр */
        }
        .menu a {
            text-decoration: none;
            color: black;
            margin-right: 30px;
            font-weight: 500;
        }
        .login-btn {
            margin-left: auto; /* Хоть что-то хорошее */
            border: 1px solid black;
            padding: 10px 25px;
            border-radius: 30px;
            text-decoration: none;
            color: black;
            font-weight: bold;
        }
        /* Hero */
        .hero {
            display: flex;
            margin-top: 50px;
        }
        .hero-left {
            width: 50%;
            padding-top: 40px;
        }
        .hero h1 {
            font-size: 60px;
            line-height: 1.1;
            margin-bottom: 20px;
        }
        .btn-orange {
            background: #F35A05;
            color: white;
            padding: 20px 50px;
            border-radius: 30px;
            display: inline-block; /* Див ведет себя как кнопка */
            font-weight: bold;
            cursor: pointer;
        }
        .price-text {
            display: flex;
            margin-top: 20px;
            color: #808296;
        }
        .smiley {
            position: relative;
            top: 10px; /* Подгонка на глаз */
            left: 5px;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="top-bar">
        <div class="logo-area">
            <img src="image/logo.svg" width="55">
            <div class="logo-text">
                <div class="logo-title">TurboCore</div>
                <div class="logo-subtitle">семантика за минуту</div>
            </div>
        </div>
        <div class="menu">
            <a href="#">КАК РАБОТАЕТ</a>
            <a href="#">ЦЕНЫ</a>
            <a href="#">ЧАСТЫЕ ВОПРОСЫ</a>
        </div>
        <a href="#" class="login-btn">ВХОД</a>
    </div>

    <div class="hero">
        <div class="hero-left">
            <h1>Готовая семантика<br>за 1 минуту</h1>
            <p>Сервис автоматического сбора очищенных<br>запросов для любой страницы сайта</p>
            <div style="display: flex; align-items: center; gap: 20px;">
                <div class="btn-orange">ПОПРОБОВАТЬ</div>
                <div class="price-text">
                    При регистрации 500 ₽,<br>хватит чтобы влюбиться
                    <img src="image/love.svg" class="smiley">
                </div>
            </div>
        </div>
        <div class="hero-right">
            <img src="image/sectionone_right.svg" width="550">
        </div>
    </div>
</div>
</body>
</html>
